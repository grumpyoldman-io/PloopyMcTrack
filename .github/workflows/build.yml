name: Build firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./build.sh macos
          ./build.sh macos_debug
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.uf2
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.uf2
